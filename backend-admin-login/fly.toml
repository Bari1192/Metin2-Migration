app = "backend-admin-login"
primary_region = "otp"

[deploy]
  release_command = "php artisan items:import-json"

[build]
    dockerfile = "Dockerfile"

[http_service]
    internal_port = 8080
    force_https = true
    auto_stop_machines = false
    auto_start_machines = true
    min_machines_running = 0


[[vm]]
    cpu_kind = "shared"
    cpus = 1
    memory_mb = 1024